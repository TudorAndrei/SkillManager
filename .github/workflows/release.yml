name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Create semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      tag: ${{ steps.semantic-release.outputs.new_release_git_tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Create release from Conventional Commits
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package ${{ matrix.name }}
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            architecture: X64
            builder: --linux --x64
            archive: SkillManager-linux-x64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            architecture: ARM64
            builder: --mac --arm64
            archive: SkillManager-macos-arm64.zip

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.architecture }}"

      - name: Install tooling
        run: npm ci

      - name: Ensure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Install the pinned skills CLI
        run: npm ci --prefix vendor

      - name: Install renderer dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Set the package version from the release tag
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Check the bundled CLI is packaged
        run: |
          bundled=$(find release -path '*skills-cli/node_modules/skills/bin/cli.mjs' | head -1)
          test -n "$bundled"
          echo "bundled CLI: $bundled"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_ASSET: release/${{ matrix.archive }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
