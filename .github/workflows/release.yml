name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Create semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      tag: ${{ steps.semantic-release.outputs.new_release_git_tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Create release from Conventional Commits
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package ${{ matrix.name }}
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linux
            architecture: X64
            archive: SkillManager-linux-x64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            target: macos
            architecture: ARM64
            archive: SkillManager-macos-arm64.zip

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install locked Native SDK CLI
        run: npm ci --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Linux system WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.architecture }}"

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Set package version from release tag
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          perl -0pi -e 's/\.version = "[^"]+"/.version = "$ENV{RELEASE_VERSION}"/' app.zon
          grep -F ".version = \"$RELEASE_VERSION\"" app.zon

      - name: Validate, test, and build
        run: |
          ./node_modules/.bin/native validate app.zon
          ./node_modules/.bin/native check --strict
          ./node_modules/.bin/native test --yes
          ./node_modules/.bin/native doctor --manifest app.zon --strict
          ./node_modules/.bin/native build --yes

      - name: Package Linux application
        if: matrix.target == 'linux'
        run: |
          ./node_modules/.bin/native package --target linux --output dist/SkillManager --binary zig-out/bin/skillmanager --assets frontend/dist
          tar -C dist -czf "dist/${{ matrix.archive }}" SkillManager

      - name: Package macOS application
        if: matrix.target == 'macos'
        run: |
          ./node_modules/.bin/native package --target macos --output dist/SkillManager.app --binary zig-out/bin/skillmanager --assets frontend/dist --signing none
          ditto -c -k --sequesterRsrc --keepParent dist/SkillManager.app "dist/${{ matrix.archive }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_ASSET: dist/${{ matrix.archive }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
