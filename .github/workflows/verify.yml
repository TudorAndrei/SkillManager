name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            architecture: X64
          - name: macOS arm64
            runner: macos-latest
            architecture: ARM64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install locked Native SDK CLI
        run: npm ci --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Linux system WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.architecture }}"

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Validate, test, and build
        run: |
          ./node_modules/.bin/native validate app.zon
          ./node_modules/.bin/native check --strict
          ./node_modules/.bin/native test --yes
          ./node_modules/.bin/native doctor --manifest app.zon --strict
          ./node_modules/.bin/native build --yes
