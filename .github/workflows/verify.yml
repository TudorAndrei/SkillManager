name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            architecture: X64
          - name: macOS arm64
            runner: macos-latest
            architecture: ARM64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install locked Native SDK CLI
        run: npm ci --ignore-scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Linux system WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.architecture }}"

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Validate, test, and build
        run: |
          ./node_modules/.bin/native validate app.zon
          ./node_modules/.bin/native check --strict
          ./node_modules/.bin/native test --yes
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./node_modules/.bin/native doctor --manifest app.zon --strict
          else
            ./node_modules/.bin/native doctor --manifest app.zon
          fi
          ./node_modules/.bin/native build --yes
