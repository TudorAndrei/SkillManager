name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            architecture: X64
          - name: macOS arm64
            runner: macos-latest
            architecture: ARM64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.architecture }}"

      - name: Install tooling
        run: npm ci

      - name: Ensure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Install the pinned skills CLI
        run: npm ci --prefix vendor

      - name: Install renderer dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for unused files, exports, and dependencies
        run: npm run knip

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
